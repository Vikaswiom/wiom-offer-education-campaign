<title>सही अमाउंट कस्टमर के व्योम ऐप में — Offer Education (banner page)</title>
<!--
Offer Education - full-page Appchitra creative - IN-APP BANNER BUILD.

  https://vikaswiom.github.io/wiom-offer-education-campaign/offer.html?cspId=<ID>
  ...&app=TECH   on the technician app's banner

This is the BANNER version of Downloads/CT_offer_page_CSP.html. The artwork is
byte-identical; only the plumbing differs, in exactly two ways:

1. IDENTITY comes from the URL, not from CleverTap. The app appends cspId when
   the CSP taps the banner, so this page knows who is reading without any
   CleverTap profile. Parameter name is read tolerantly - cspId / csp_id /
   csp-id / cspid / csp / uid / id, query string or hash - because different
   surfaces spell it differently and a silent mismatch here costs the whole log.

2. TRACKING goes to a Google Sheet via an Apps Script pixel beacon, EVERY TIME.
   No per-day dedup, no once-per-device guard: one row per view, one row per
   ठीक है tap, so the sheet answers "how many times has this CSP been taught
   this" and not just "has he ever". CleverTap events still fire IF the app
   happens to inject its bridge, as a free second channel - but nothing here
   depends on that, which is the whole point of moving off the in-app.

EVENT NAMES ARE DELIBERATELY NOT THE IN-APP ONES.
The CT in-app creative fires CSP_Offer_Page_Shown / CSP_Offer_Page_OK_Clicked and
those are already wired into dashboard.html as variant "offer_page". Reusing them
here would silently merge the banner surface into the in-app funnel - the same
trap the in-app build's own header warns about. This page fires
CSP_Offer_Banner_Shown / CSP_Offer_Banner_OK_Clicked (TECH_* on the tech app).

THE ONE LINE TO FILL IN: var LOG = '...' below - the Apps Script /exec URL bound
to the tracking sheet. Empty = the page still renders and the button still works,
it just logs nothing. Apps Script source lives in offer-sheet.gs in this repo.

ES5 ONLY - no arrow functions, no const/let, no template literals. The CSP app's
WebView can be as old as Chrome 38, where those are a SyntaxError that kills the
entire script: the page still paints, so the failure looks like "the button does
nothing" rather than an error. Same reason the ₹750 flow pages were transpiled.
-->
<style>
:root{
--brand:#D9008D; --brand-tint:#FFE5F6;
--ink:#161021; --muted:#665E75;
--pos:#008043; --pos-bg:#E1FAED;
--skel:#E8E4F0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;-webkit-text-size-adjust:100%}
/* The gradient sits on <body> too, so a tablet or a very wide WebView shows
   brand colour in the gutters instead of a dark band. */
body{background:#F5EFF6;display:flex;justify-content:center;touch-action:manipulation;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",system-ui,sans-serif;
-webkit-font-smoothing:antialiased}

/* ── The full mobile page ── */
.app{width:100%;max-width:420px;min-height:100vh;min-height:100dvh;min-height:calc(var(--vh,1vh) * 100);
display:flex;flex-direction:column;align-items:center;
background:linear-gradient(180deg,#F9E3F0 0%,#F5EFF6 45%,#F3F0F8 100%);
color:var(--ink);overflow-x:hidden;
padding:calc(40px + env(safe-area-inset-top)) 24px calc(16px + env(safe-area-inset-bottom))}

.ttl{font-size:24px;line-height:32px;font-weight:700;text-align:center;letter-spacing:-.2px;position:relative;z-index:1}

/* hero — the customer's phone + the ask, centered as one unit */
.hero{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:300px}
.phonewrap{position:relative;display:flex;justify-content:center}
.halo{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
width:390px;height:390px;border-radius:50%;z-index:0;
background:radial-gradient(closest-side,rgba(255,224,243,.95),rgba(255,229,246,.55) 58%,rgba(255,229,246,0))}
/* phone at a real mobile aspect ratio (~1:2) — it depicts the customer's Wiom app */
.phone{position:relative;z-index:1;width:164px;background:var(--ink);border-radius:26px;padding:8px;
box-shadow:0 4px 12px rgba(217,43,144,.3)}
.scr{background:#FFFFFF;border-radius:19px;height:320px;padding:14px 12px 16px;
display:flex;flex-direction:column;align-items:center}
.bar{display:flex;align-items:center;gap:5px;flex:0 0 auto}
.dot{width:10px;height:10px;border-radius:50%;background:var(--brand)}
.brand{font-size:14px;font-weight:700;color:var(--brand);line-height:1}
/* the offer block — centered like the app's hero content */
.mid{margin:auto 0;display:flex;flex-direction:column;align-items:center}
.off{font-size:14px;font-weight:600;color:var(--muted);line-height:1}
.amt{margin-top:12px;font-size:36px;font-weight:700;line-height:1;color:var(--ink)}
.amt span{letter-spacing:5px}
.fin{margin-top:16px;display:inline-flex;align-items:center;gap:4px;
background:var(--pos-bg);color:var(--pos);font-size:13px;font-weight:700;line-height:1;padding:6px 10px;border-radius:888px}
.fin svg{width:12px;height:12px;stroke:var(--pos);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
/* placeholder list rows at the bottom of the screen */
.skl{flex:0 0 auto;display:flex;flex-direction:column;gap:7px;align-items:center}
.skl i{display:block;height:6px;border-radius:3px;background:var(--skel)}

/* customer bust anchored to the phone — whose phone this is */
.cust{position:absolute;left:-36px;bottom:-14px;z-index:2;display:flex;flex-direction:column;align-items:center;gap:4px}
.cust .av{width:62px;height:62px;border-radius:50%;border:3px solid #fff;overflow:hidden;
box-shadow:0 2px 6px rgba(22,16,33,.15);background:#E9E5F2}
.cust .av svg{display:block;width:100%;height:100%}
.cust .nm{font-size:12px;line-height:16px;font-weight:600;color:var(--muted);background:#FFFFFF;
padding:2px 8px;border-radius:888px;box-shadow:0 1px 3px rgba(22,16,33,.1)}

.ask{font-size:16px;line-height:24px;font-weight:600;color:var(--muted);text-align:center;max-width:300px;
position:relative;z-index:1;margin-top:40px}

/* ठीक है = acknowledge → pink TEXT CTA per house convention, never a filled primary. 24 + 2×12 = 48px target */
.cta{margin-top:16px;width:100%;text-align:center;padding:12px 16px;
font-size:16px;line-height:24px;font-weight:700;color:var(--brand);cursor:pointer;user-select:none;
-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
transition:opacity .12s ease}
.cta:active{opacity:.55}
/* Once tapped, stop a second tap firing a second dismiss mid-teardown. */
.cta.gone{opacity:.4;pointer-events:none}

/* ── Narrow layout viewports ──────────────────────────────────────────────
   A real handset (17 Sep) rendered this page with the phone mock at roughly
   double size and the title pushed off-screen: the app's WebView handed the
   page a layout viewport near 180 CSS px rather than ~360, so a 164px mock
   nearly filled it. The hero was built from fixed pixel sizes and had no
   answer to that. These steps keep it composed all the way down.
   Plain media queries, not clamp()/min() - the CSP app's WebView can be
   Chrome 38, where those are dropped and the fixed value silently wins. */
@media (max-width:360px){
.app{padding-left:18px;padding-right:18px}
.ttl{font-size:21px;line-height:28px}
.phone{width:138px}
.scr{height:268px}
.amt{font-size:30px}
.halo{width:320px;height:320px}
.cust{left:-28px}
.cust .av{width:52px;height:52px}
.ask{margin-top:28px;font-size:15px;line-height:22px}
}
@media (max-width:300px){
/* The hand-placed line break balances the title at full width; below this
   it just strands a short line, so let the text find its own breaks. */
.brk{display:none}
.app{padding-left:14px;padding-right:14px}
.ttl{font-size:18px;line-height:25px}
.phone{width:112px;border-radius:20px;padding:6px}
.scr{height:214px;border-radius:15px;padding:10px 8px 12px}
.off{font-size:12px}
.amt{font-size:24px;margin-top:9px}
.amt span{letter-spacing:3px}
.fin{font-size:11px;padding:5px 8px}
.brand{font-size:12px}
.halo{width:250px;height:250px}
.cust{left:-20px;bottom:-10px}
.cust .av{width:42px;height:42px;border-width:2px}
.cust .nm{font-size:10px;line-height:14px;padding:2px 6px}
.hero{min-height:0}
.ask{margin-top:20px;font-size:14px;line-height:20px;max-width:none}
.cta{font-size:15px}
}
@media (max-width:230px){
.ttl{font-size:16px;line-height:22px;letter-spacing:0}
.phone{width:92px;border-radius:16px;padding:5px}
.scr{height:176px;border-radius:12px}
.amt{font-size:19px}
.fin{font-size:10px;padding:4px 7px}
.halo{width:200px;height:200px}
.cust{display:none}
.ask{margin-top:16px;font-size:13px;line-height:19px}
}

/* Shown only if nothing closed the page ~1.2s after the tap. The app's
   WebView (WiomWebView.kt) exposes no JS bridge, no WebChromeClient and no
   scheme interception, so today the page CANNOT close itself and a tap that
   appears to do nothing reads as broken. This line is self-removing: once the
   app adds a close bridge, the WebView is gone long before 1.2s and it never
   appears. */
.hint{margin-top:2px;text-align:center;font-size:13px;line-height:18px;color:var(--muted);
opacity:0;transition:opacity .2s ease;pointer-events:none}
.hint.show{opacity:1}

/* Short devices (a 5" 1280×720 handset is ~640 CSS px tall) — shrink the
   phone mock rather than let the CTA fall below the fold. */
@media (max-height:700px){
.app{padding-top:calc(24px + env(safe-area-inset-top))}
.ttl{font-size:22px;line-height:29px}
.scr{height:250px}
.halo{width:320px;height:320px}
.ask{margin-top:24px}
.hero{min-height:0}
}
</style>
</head>
<body>
<div class="app">

<p class="ttl">सही अमाउंट कस्टमर के <br class="brk">व्योम ऐप में है</p>

<div class="hero">
<div class="phonewrap">
<div class="halo"></div>
<div class="phone">
<div class="scr">
<div class="bar"><span class="dot"></span><span class="brand">व्योम</span></div>
<div class="mid">
<div class="off">आपका ऑफर</div>
<div class="amt">₹ <span>•••</span></div>
<div class="fin">
<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5l2.6 2.6L10 3.5"/></svg>
फाइनल अमाउंट
</div>
</div>
<div class="skl"><i style="width:88px"></i><i style="width:58px"></i></div>
</div>
<div class="cust">
<div class="av">
<svg viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<defs><clipPath id="fpCust"><circle cx="26" cy="26" r="26"/></clipPath></defs>
<circle cx="26" cy="26" r="26" fill="#E9E5F2"/>
<g clip-path="url(#fpCust)">
<path d="M6 54c0-12 9-18 20-18s20 6 20 18z" fill="#5C6B8A"/>
<rect x="21.5" y="26" width="9" height="10" rx="4" fill="#E5B183"/>
<circle cx="26" cy="15" r="10.5" fill="#2E2838"/>

</g>

</div>

</div>

<p class="ask">बस कस्टमर को उनका व्योम ऐप देखने को बोलें</p>
</div>

<div class="cta" id="ok" role="button" tabindex="0">ठीक है</div>
<p class="hint" id="hint">बंद करने के लिए ऊपर ← दबाएँ</p>
</div>

<script>
/* Block comments only, ES5 only - see the note at the top of the file. */
(function(){
'use strict';

/* ═══════════════ THE ONE LINE TO FILL IN ═══════════════
   Apps Script /exec URL bound to the tracking Google Sheet.
   Source to paste into that project = offer-sheet.gs in this repo.
   Leave '' and the page works but logs nothing. */
var LOG = 'https://script.google.com/macros/s/AKfycbzjcvUOC_l23lHmweSUYlxnGgGBTSezci5Jv6qZKINwHLEb5GUDq9SE97xULDmwyBKUGw/exec';

/* Deep link the ठीक है tap aims at — see closePage(). */
var HOME_LINK = 'https://csp.wiom.in/home';
var CREATIVE = 'offer_page_appchitra_v1';
var PAGE     = 'offer';

/* ── URL parameters ───────────────────────────────────────────────────
   One pass over query AND hash, keys lower-cased with _ and - stripped,
   so cspId / csp_id / csp-id / CSPID all land in the same bucket. Whoever
   wires the banner cannot get the spelling wrong in a way that silently
   empties the log. */
var Q = (function(){
  var out = {}, m, re = /[?&#]([a-zA-Z0-9_\-]+)=([^&#]*)/g, s = location.search + location.hash, v;
  while ((m = re.exec(s))) {
    try { v = decodeURIComponent(m[2].replace(/\+/g, ' ')); } catch (e) { v = m[2]; }
    out[m[1].toLowerCase().replace(/[_\-]/g, '')] = v;
  }
  return out;
})();

function clean(v){
  v = String(v == null ? '' : v).replace(/^\s+|\s+$/g, '');
  /* An unresolved personalisation token ({{Profile.cspid}}, {cspId}, "default")
     is worse than nothing: it would log as a real id shared by everyone. */
  if (!v || v.toLowerCase() === 'default' || v.indexOf('{') >= 0 || v.indexOf('%7B') >= 0) return '';
  return v.substring(0, 80);
}

var CSP_ID = clean(Q.cspid || Q.csp || Q.uid || Q.userid || Q.id);

/* CSP app vs technician app. The banner URL carries &app=TECH on the
   technician side; anything unrecognised is treated as CSP rather than
   dropped, so a missing param never loses the row. */
var APP = String(Q.app || '').toUpperCase();
if (APP !== 'TECH' && APP !== 'CSP') APP = 'CSP';

/* One id per page open, carried on every row. Lets the sheet pair a view
   with the tap that followed it, and tell two opens apart from a reload.

   SENT AS `oid`, NEVER `sid`. `sid` is reserved by Google's own frontend on
   script.google.com: a request carrying a session-id-shaped sid= value is
   rejected with HTTP 400 BEFORE the Apps Script runs, so there is no execution
   log, no error text, and the caller gets a generic Drive "unable to open the
   file" page. Verified by interleaved A/B: same value, sid=400 / oid=302. */
var OID = (function(){
  var s = '';
  try { s = Math.random().toString(36).substring(2, 8); } catch (e) {}
  return (+new Date()).toString(36) + (s || 'xxxxxx');
})();

/* NOTE on the missing-id case: unlike the ₹750 opt-in pages, this page does
   NOT gate on a missing cspId. That page needed identity to record consent;
   this one only teaches something, and refusing to teach because a token did
   not resolve is the worse failure. The row is written with csp_id="unknown"
   so a broken banner shows up as a block of unknowns in the sheet instead of
   as silence. */
var UID = CSP_ID || 'unknown';

/* ── Sheet beacon ─────────────────────────────────────────────────────
   Apps Script answers with a 302 to script.googleusercontent.com. Some
   in-app WebViews drop that redirect for an <img>, and some have no fetch
   at all, so the channels form a FALLBACK CHAIN: fetch(no-cors) first, and
   Image/XHR only if it actually threw. Firing them together would write two
   identical rows. keepalive lets the request outlive the ठीक है teardown. */
function beacon(url){
  function viaImage(){ try { new Image().src = url; return true; } catch (e) { return false; } }
  function viaXhr(){
    try { var x = new XMLHttpRequest(); x.open('GET', url, true); x.send(); return true; }
    catch (e) { return false; }
  }
  if (typeof fetch === 'function') {
    try {
      fetch(url, { mode: 'no-cors', cache: 'no-store', keepalive: true })
        .catch(function(){ if (!viaImage()) viaXhr(); });
      return;
    } catch (e) {}
  }
  if (!viaImage()) viaXhr();
}

/* ── CleverTap, best effort only ──────────────────────────────────────
   A banner WebView usually has no CleverTap bridge. If the app does inject
   one, these land as a free second channel; if not, the six retries expire
   quietly and the sheet is still complete. Names are _Banner_, never the
   in-app's _Page_ - see the header. */
var ctSent = {};
function ct(name, props){
  var ev = APP + '_Offer_Banner_' + name;
  if (ctSent[ev]) return;
  ctSent[ev] = { done: false, n: 0 };
  var p = { app: APP, creative: CREATIVE, surface: 'banner', csp_id: UID };
  if (props) { for (var k in props) if (Object.prototype.hasOwnProperty.call(props, k)) p[k] = props[k]; }
  (function attempt(){
    var st = ctSent[ev];
    if (st.done) return;
    try {
      if (window.CleverTap && typeof window.CleverTap.pushEvent === 'function') {
        window.CleverTap.pushEvent(ev, JSON.stringify(p)); st.done = true; return;
      }
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.clevertap) {
        window.webkit.messageHandlers.clevertap.postMessage(
          { action: 'recordEventWithProps', event: ev, properties: p });
        st.done = true; return;
      }
    } catch (e) {}
    st.n++;
    if (st.n < 6) setTimeout(attempt, 250 * st.n);
  })();
}

/* ── The two tracked moments ──────────────────────────────────────────
   EVERY view and EVERY tap, no dedup on this side and none on the sheet
   side either: repeat exposure is the thing being measured. */
function log(event){
  if (!LOG) return;
  beacon(LOG
    + '?flow=OFFER'
    + '&event=' + encodeURIComponent(event)
    + '&uid='   + encodeURIComponent(UID)
    + '&app='   + encodeURIComponent(APP)
    + '&page='  + encodeURIComponent(PAGE)
    + '&oid='   + encodeURIComponent(OID)
    + '&t='     + (+new Date()));
}

/* ── Closing the banner ───────────────────────────────────────────────
   There is no CleverTap in-app to dismiss here, and the host app's JS bridge
   is not documented, so this tries every shape an Android WebView bridge
   commonly takes before falling back to the browser's own exits. Open the
   page with &diag=1 on a handset to see exactly what this app injects - the
   overlay lists every bridge-shaped object on window - and once that is known
   this whole ladder collapses to the one real call.

   history.back() is fired unconditionally: the earlier history.length > 1
   guard meant that a banner opened as the WebView's FIRST page - which is the
   normal case - skipped it and the page simply stayed put. */
function closePage(){
  var i, j, k, b, m, mh;
  var NAMES = ['CleverTap','Android','AndroidBridge','AndroidInterface','AndroidApp',
               'WiomApp','Wiom','wiom','JSBridge','JsBridge','NativeBridge','AppBridge',
               'NativeInterface','JavascriptInterface','nativeApp','mobileApp','app','bridge'];
  /* goHome first: ठीक है should land the CSP back on the app's home screen,
     not on whatever screen happened to be underneath. Everything after it is a
     fallback for a bridge that only knows how to close. */
  var METHODS = ['goHome','home','openHome',
                 'dismissInAppNotification','closeInAppNotification','closeWebView',
                 'closeWebview','closeWindow','closePage','close','finishActivity',
                 'finish','dismiss','exit','goBack','back','onBackPressed'];
  for (i = 0; i < NAMES.length; i++) {
    try { b = window[NAMES[i]]; } catch (e) { b = null; }
    if (!b) continue;
    for (j = 0; j < METHODS.length; j++) {
      try {
        if (typeof b[METHODS[j]] === 'function') { b[METHODS[j]](); return; }
      } catch (e) {}
    }
  }
  /* The app's own deep link to home. csp.wiom.in is the verified app-link
     host and /home maps to AppRoutes.HOME in DeepLinkRouter.

     FIRED INTO A HIDDEN IFRAME, NEVER location.href. If the app is not
     intercepting WebView navigations, location.href would replace the creative
     with whatever csp.wiom.in/home serves a browser - very likely a 404 - and
     the CSP would be left staring at an error instead of the page they just
     acknowledged. An iframe load fails invisibly and leaves the page intact,
     so this is safe to ship before the app side exists. */
  try {
    var fr = document.createElement('iframe');
    fr.setAttribute('aria-hidden', 'true');
    fr.style.cssText = 'position:absolute;width:0;height:0;border:0;visibility:hidden';
    fr.src = HOME_LINK;
    document.body.appendChild(fr);
    setTimeout(function(){ try { fr.parentNode.removeChild(fr); } catch (e) {} }, 1500);
  } catch (e) {}

  try {
    mh = window.webkit && window.webkit.messageHandlers;
    if (mh) {
      var HS = ['close','closeWebView','nativeClose','dismiss','clevertap','jsBridge','bridge'];
      for (k = 0; k < HS.length; k++) {
        if (mh[HS[k]] && typeof mh[HS[k]].postMessage === 'function') {
          mh[HS[k]].postMessage({ action: 'close' }); return;
        }
      }
    }
  } catch (e) {}
  try { window.open('', '_self'); } catch (e) {}
  try { window.close(); } catch (e) {}
  try { history.back(); } catch (e) {}
}

/* ── Bridge discovery ─────────────────────────────────────────────────
   &diag=1 only. Lists every object on window that looks like an injected
   native bridge (an object carrying functions) plus its method names, so the
   real close call can be identified from a screenshot instead of guessed at.
   Costs nothing when the parameter is absent. */
function diagOverlay(){
  var out = [], k, v, fns, i, seen = {};
  var SKIP = {window:1, self:1, top:1, parent:1, frames:1, document:1, location:1,
              navigator:1, history:1, screen:1, localStorage:1, sessionStorage:1,
              performance:1, console:1, crypto:1, caches:1, indexedDB:1, webkit:1};
  for (k in window) {
    if (SKIP[k] || seen[k]) continue;
    seen[k] = 1;
    try { v = window[k]; } catch (e) { continue; }
    if (!v || (typeof v !== 'object' && typeof v !== 'function')) continue;
    fns = [];
    try {
      for (i in v) { if (typeof v[i] === 'function') fns.push(i); if (fns.length > 11) break; }
    } catch (e) { continue; }
    if (fns.length) out.push(k + ' → ' + fns.join(', '));
    if (out.length > 26) break;
  }
  var wk = [];
  try {
    var mh = window.webkit && window.webkit.messageHandlers;
    if (mh) for (k in mh) wk.push(k);
  } catch (e) {}

  var box = document.createElement('div');
  box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;top:0;z-index:99999;overflow:auto;'
    + 'background:#161021;color:#7CFFB2;font:10px/1.5 monospace;padding:10px;'
    + 'white-space:pre-wrap;word-break:break-all;-webkit-user-select:text;user-select:text';
  box.textContent =
      'BRIDGE DIAG — screenshot this\n'
    + 'viewport ' + window.innerWidth + '×' + window.innerHeight
    + '  dpr ' + (window.devicePixelRatio || '?') + '\n'
    + 'cspId=' + UID + '  app=' + APP + '\n'
    + 'webkit.messageHandlers: ' + (wk.length ? wk.join(', ') : 'none') + '\n'
    + '---- objects on window carrying functions ----\n'
    + (out.length ? out.join('\n') : 'none found');
  box.addEventListener('click', function(){ box.parentNode.removeChild(box); }, false);
  document.body.appendChild(box);
}
if (Q.diag) { try { diagOverlay(); } catch (e) {} }


var okDone = false;
function onOK(){
  if (okDone) return;
  okDone = true;
  document.getElementById('ok').className = 'cta gone';
  log('ok');
  ct('OK_Clicked');
  /* Closing tears down the WebView, so give the beacon a moment to leave. */
  setTimeout(closePage, 400);
  /* If the page is still here a moment later, nothing closed it - say so
     rather than leaving a tap that looks dead. Self-removing: see .hint. */
  setTimeout(function(){
    try { document.getElementById('hint').className = 'hint show'; } catch (e) {}
  }, 1200);
}

var ok = document.getElementById('ok');
ok.addEventListener('click', onOK, false);
ok.addEventListener('keydown', function(e){
  if (e.keyCode === 13 || e.keyCode === 32) { e.preventDefault(); onOK(); }
}, false);

/* ── Viewport height, measured ──
   A photo from a real handset (17 Sep) showed the page not filling the app's
   WebView: content stranded in the top third with the CTA in empty space. Some
   in-app WebViews mis-report viewport units, so the height is also set from
   window.innerHeight and re-set on resize/rotate. The CSS declares 100vh, then
   100dvh, then calc(var(--vh)*100) - last valid wins, so this takes over
   wherever it is available and changes nothing where vh already worked. */
function setVH(){
  try {
    var h = window.innerHeight || document.documentElement.clientHeight;
    if (h) document.documentElement.style.setProperty('--vh', (h / 100) + 'px');
  } catch (e) {}
}
setVH();
window.addEventListener('resize', setVH, false);
window.addEventListener('orientationchange', function(){ setTimeout(setVH, 120); }, false);

log('view');
ct('Shown');
})();
</script>

<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>कस्टमर से बात करने वालों के कनेक्शन कम कैंसिल होते हैं — Call-First Nudge</title>
<!--
Call-First Nudge - IN-APP BANNER BUILD.
Spec: "Call-First Nudge" proposal v0.1 (9 Sep 2026), §Anatomy / §Copy.

  https://vikaswiom.github.io/wiom-offer-education-campaign/callnudge.html?cspId=<ID>
  ...&app=TECH   on the technician app's banner

Sibling of offer.html. Same plumbing, same tracking sheet, different `page`
value so the two funnels can never mix: offer.html logs page="offer", this logs
page="callnudge".

WHAT CHANGED FROM THE CleverTap CUSTOM-HTML VERSION, AND WHY:

1. THE SCRIM IS GONE AND THE CARD IS NOW THE PAGE, laid out as a sibling of
   offer.html: centred title, haloed phone mock, supporting line, pink text CTA
   at the bottom. The first attempt kept the dialog's top-left stack, and on a
   real handset that stranded four small elements in the top third of the
   screen with the CTA floating in empty space (photo, 17 Sep). A dialog's
   composition does not survive being given a whole screen - it needs a hero.
   All copy and every token are unchanged.

   HEIGHT: the same photo showed the page not filling the WebView at all. So
   the height is declared three ways - 100vh, then 100dvh, then a --vh custom
   property measured from window.innerHeight. Last valid wins, so a WebView
   that mis-reports viewport units still gets a full-height page.

2. ONE ACKNOWLEDGE CTA. The proposal's two buttons (अभी कॉल करें / बाद में) are
   replaced by a single ठीक है, and the scrim's third dismiss path is gone with
   the scrim. This page now teaches rather than asks: there is no branch to
   record, so the funnel is simply seen -> acknowledged, exactly like
   offer.html. A CTA that promises to place a call and then only closes a page
   would also be a promise the page cannot keep.

3. IDENTITY FROM THE URL, TRACKING TO THE SHEET. The CT build carried no
   properties at all because the in-app knew who it was showing to. A banner
   does not, so cspId comes from the URL the app appends and every event is
   logged to the shared Google Sheet.

EVENTS (sheet tab `CallNudge`, page="callnudge"):
  view - once, on load
  ok   - the ठीक है tap
Renamed from the proposal's call_nudge_shown / _accepted / _dismissed: the tab
is per-creative, so the event names stay in the same shape as offer.html and
one reader can count both funnels the same way.

CleverTap events still fire best-effort as CSP/TECH_Call_Nudge_Banner_*, NOT the
proposal's call_nudge_*_csp - reusing those names would merge this surface into
the in-app campaign's numbers.

ES5 ONLY - the CSP app's WebView can be Chrome 38, where let/arrow is a
SyntaxError that kills the whole script while the page still paints.
-->
<style>
/* Tokens carried over verbatim from the CleverTap build:
   bgSurface #FFFFFF · textPrimary #161021 · textSecondary #5C5570
   brandPrimary #D9008D · bgBrandTint #FFE5F6 · positive #008043 / #E1FAED */
:root{
--brand:#D9008D; --brand-tint:#FFE5F6;
--ink:#161021; --muted:#5C5570;
--pos:#008043; --pos-bg:#E1FAED;
--skel:#E8E4F0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
-webkit-user-select:none;user-select:none}
body{background:#F5EFF6;display:flex;justify-content:center;touch-action:manipulation;
font-family:"Noto Sans Devanagari","Noto Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
color:var(--ink);-webkit-font-smoothing:antialiased}

/* Height declared three ways - see the note at the top of the file. */
.app{width:100%;max-width:420px;
min-height:100vh;min-height:100dvh;min-height:calc(var(--vh,1vh) * 100);
display:flex;flex-direction:column;align-items:center;
background:linear-gradient(180deg,#F9E3F0 0%,#F5EFF6 45%,#F3F0F8 100%);
overflow-x:hidden;
padding:calc(40px + env(safe-area-inset-top)) 24px calc(16px + env(safe-area-inset-bottom));
opacity:0;transition:opacity 200ms cubic-bezier(.2,0,0,1)}
.app.in{opacity:1}

/* headingLg scaled to the page it now owns, same weight and colour */
.ttl{font-size:24px;line-height:32px;font-weight:700;text-align:center;letter-spacing:-.2px;
position:relative;z-index:1}

/* hero — the call being made, centred as one unit */
.hero{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;
justify-content:center;width:100%;min-height:300px}
.phonewrap{position:relative;display:flex;justify-content:center}
.halo{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
width:390px;height:390px;border-radius:50%;z-index:0;
background:radial-gradient(closest-side,rgba(255,224,243,.95),rgba(255,229,246,.55) 58%,rgba(255,229,246,0))}
.phone{position:relative;z-index:1;width:164px;background:var(--ink);border-radius:26px;padding:8px;
box-shadow:0 4px 12px rgba(217,43,144,.3)}
.scr{background:#FFFFFF;border-radius:19px;height:320px;padding:18px 12px 16px;
display:flex;flex-direction:column;align-items:center}
.callto{font-size:12px;font-weight:600;color:var(--muted);line-height:1;flex:0 0 auto}
.mid{margin:auto 0;display:flex;flex-direction:column;align-items:center}
.av{width:64px;height:64px;border-radius:50%;border:3px solid #fff;overflow:hidden;
box-shadow:0 2px 6px rgba(22,16,33,.15);background:#E9E5F2}
.av svg{display:block;width:100%;height:100%}
.nm{margin-top:10px;font-size:15px;font-weight:700;line-height:1;color:var(--ink)}
.ring{margin-top:8px;font-size:12px;font-weight:600;line-height:1;color:var(--brand)}
/* the green answer pill — the call is happening, not an alert */
.ans{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:5px;
background:var(--pos-bg);color:var(--pos);font-size:12px;font-weight:700;line-height:1;
padding:8px 12px;border-radius:888px}
.ans svg{width:12px;height:12px;stroke:var(--pos);stroke-width:2.4;fill:none;
stroke-linecap:round;stroke-linejoin:round}

.ask{font-size:16px;line-height:24px;font-weight:600;color:var(--muted);text-align:center;
max-width:300px;position:relative;z-index:1;margin-top:40px}

/* ठीक है = acknowledge → pink TEXT CTA per house convention, never a filled
   primary. 24 + 2×12 = 48px tap target. Identical to offer.html's CTA. */
.cta{margin-top:16px;width:100%;text-align:center;padding:12px 16px;
font-size:16px;line-height:24px;font-weight:700;color:var(--brand);cursor:pointer;
transition:opacity .12s ease}
.cta:active{opacity:.55}
/* Once tapped, stop a second tap firing a second close mid-teardown. */
.cta.gone{opacity:.4;pointer-events:none}

/* ── Narrow layout viewports ──────────────────────────────────────────────
   Same defence as offer.html: a real handset handed that page a layout
   viewport near 180 CSS px, which a 164px fixed-width mock cannot survive.
   This page uses the same mock, so it gets the same steps. Plain media
   queries, not clamp()/min() - an old WebView drops those and keeps the
   fixed value, which is exactly the failure being fixed. */
@media (max-width:360px){
.app{padding-left:18px;padding-right:18px}
.ttl{font-size:21px;line-height:28px}
.phone{width:138px}
.scr{height:268px}
.halo{width:320px;height:320px}
.av{width:56px;height:56px}
.ask{margin-top:28px;font-size:15px;line-height:22px}
}
@media (max-width:300px){
/* The hand-placed line break balances the title at full width; below this
   it just strands a short line, so let the text find its own breaks. */
.brk{display:none}
.app{padding-left:14px;padding-right:14px}
.ttl{font-size:18px;line-height:25px}
.phone{width:112px;border-radius:20px;padding:6px}
.scr{height:214px;border-radius:15px;padding:12px 8px 12px}
.callto{font-size:11px}
.av{width:44px;height:44px;border-width:2px}
.nm{font-size:13px;margin-top:8px}
.ring{font-size:11px}
.ans{font-size:11px;padding:6px 10px}
.halo{width:250px;height:250px}
.hero{min-height:0}
.ask{margin-top:20px;font-size:14px;line-height:20px;max-width:none}
.cta{font-size:15px}
}
@media (max-width:230px){
.ttl{font-size:16px;line-height:22px;letter-spacing:0}
.phone{width:92px;border-radius:16px;padding:5px}
.scr{height:176px;border-radius:12px;padding:10px 6px 10px}
.av{width:36px;height:36px}
.nm{font-size:12px}
.ring{font-size:10px}
.ans{font-size:10px;padding:5px 8px}
.halo{width:200px;height:200px}
.ask{margin-top:16px;font-size:13px;line-height:19px}
}

/* Shown only if nothing closed the page ~1.2s after the tap. The app's
   WebView (WiomWebView.kt) exposes no JS bridge, no WebChromeClient and no
   scheme interception, so today the page CANNOT close itself and a tap that
   appears to do nothing reads as broken. This line is self-removing: once the
   app adds a close bridge, the WebView is gone long before 1.2s and it never
   appears. */
.hint{margin-top:2px;text-align:center;font-size:13px;line-height:18px;color:var(--muted);
opacity:0;transition:opacity .2s ease;pointer-events:none}
.hint.show{opacity:1}

/* Short devices — a 5" 1280×720 handset is ~640 CSS px tall. Shrink the mock
   rather than let the CTA fall below the fold. */
@media (max-height:700px){
.app{padding-top:calc(24px + env(safe-area-inset-top))}
.ttl{font-size:22px;line-height:29px}
.scr{height:250px}
.halo{width:320px;height:320px}
.ask{margin-top:24px}
.hero{min-height:0}
}
@media (prefers-reduced-motion:reduce){.app{transition-duration:1ms}}
</style>
</head>
<body>
<div class="app" id="app">

<p class="ttl">कस्टमर से बात करने वालों के <br class="brk">कनेक्शन कम कैंसिल होते हैं</p>

<div class="hero">
<div class="phonewrap">
<div class="halo"></div>
<div class="phone">
<div class="scr">
<div class="callto">कॉल हो रही है</div>
<div class="mid">
<div class="av">
<svg viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<defs><clipPath id="cnCust"><circle cx="26" cy="26" r="26"/></clipPath></defs>
<circle cx="26" cy="26" r="26" fill="#E9E5F2"/>
<g clip-path="url(#cnCust)">
<path d="M6 54c0-12 9-18 20-18s20 6 20 18z" fill="#5C6B8A"/>
<rect x="21.5" y="26" width="9" height="10" rx="4" fill="#E5B183"/>
<circle cx="26" cy="15" r="10.5" fill="#2E2838"/>
<circle cx="26" cy="21" r="10" fill="#F3C9A3"/>
</g>
</svg>
</div>
<div class="nm">कस्टमर</div>
<div class="ring">पता और समय पूछें</div>
</div>
<div class="ans">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
कॉल
</div>
</div>
</div>
</div>

<p class="ask">पता और समय कस्टमर से कन्फ़र्म कर लें।</p>
</div>

<div class="cta" id="ok" role="button" tabindex="0">ठीक है</div>
<p class="hint" id="hint">बंद करने के लिए ऊपर ← दबाएँ</p>
</div>

<script>
/* Block comments only, ES5 only - see the note at the top of the file. */
(function(){
'use strict';

/* Apps Script /exec bound to the offer-education-campaign sheet - the SAME
   endpoint offer.html uses. The `page` value is what separates the funnels. */
var LOG  = 'https://script.google.com/macros/s/AKfycbzjcvUOC_l23lHmweSUYlxnGgGBTSezci5Jv6qZKINwHLEb5GUDq9SE97xULDmwyBKUGw/exec';
var PAGE = 'callnudge';
var CREATIVE = 'call_first_nudge_v1';

/* ── URL parameters ─── one pass over query AND hash, keys lower-cased with
   _ and - stripped, so cspId / csp_id / csp-id / CSPID all land together. */
var Q = (function(){
  var out = {}, m, re = /[?&#]([a-zA-Z0-9_\-]+)=([^&#]*)/g, s = location.search + location.hash, v;
  while ((m = re.exec(s))) {
    try { v = decodeURIComponent(m[2].replace(/\+/g, ' ')); } catch (e) { v = m[2]; }
    out[m[1].toLowerCase().replace(/[_\-]/g, '')] = v;
  }
  return out;
})();

function clean(v){
  v = String(v == null ? '' : v).replace(/^\s+|\s+$/g, '');
  /* An unresolved personalisation token is worse than nothing - it would log
     as one real-looking id shared by everyone. */
  if (!v || v.toLowerCase() === 'default' || v.indexOf('{') >= 0 || v.indexOf('%7B') >= 0) return '';
  return v.substring(0, 80);
}

var UID = clean(Q.cspid || Q.csp || Q.uid || Q.userid || Q.id) || 'unknown';

var APP = String(Q.app || '').toUpperCase();
if (APP !== 'TECH' && APP !== 'CSP') APP = 'CSP';

/* One id per page open, on every row: pairs the view with the tap that
   followed it. SENT AS `oid`, NEVER `sid` - Google reserves sid on
   script.google.com and 400s the request before the Apps Script runs, with no
   execution log and nothing for a try/catch to catch. */
var OID = (function(){
  var s = '';
  try { s = Math.random().toString(36).substring(2, 8); } catch (e) {}
  return (+new Date()).toString(36) + (s || 'xxxxxx');
})();

/* ── Sheet beacon ─── fetch(no-cors) first, Image/XHR only if it actually
   threw: a FALLBACK CHAIN, not a broadcast, or every tap writes two rows.
   keepalive lets the request outlive the page teardown. */
function bcn(url){
  function viaImage(){ try { new Image().src = url; return true; } catch (e) { return false; } }
  function viaXhr(){
    try { var x = new XMLHttpRequest(); x.open('GET', url, true); x.send(); return true; }
    catch (e) { return false; }
  }
  if (typeof fetch === 'function') {
    try {
      fetch(url, { mode: 'no-cors', cache: 'no-store', keepalive: true })
        .catch(function(){ if (!viaImage()) viaXhr(); });
      return;
    } catch (e) {}
  }
  if (!viaImage()) viaXhr();
}

function log(event){
  if (!LOG) return;
  bcn(LOG
    + '?flow=OFFER'
    + '&event=' + encodeURIComponent(event)
    + '&uid='   + encodeURIComponent(UID)
    + '&app='   + encodeURIComponent(APP)
    + '&page='  + encodeURIComponent(PAGE)
    + '&oid='   + encodeURIComponent(OID)
    + '&t='     + (+new Date()));
}

/* ── CleverTap, best effort only ─── a banner WebView usually has no bridge.
   Names are _Call_Nudge_Banner_, never the proposal's call_nudge_*_csp, so
   this surface can never merge into the in-app campaign's numbers. */
var ctSent = {};
function ct(name){
  var ev = APP + '_Call_Nudge_Banner_' + name;
  if (ctSent[ev]) return;
  ctSent[ev] = { done: false, n: 0 };
  var p = { app: APP, creative: CREATIVE, surface: 'banner', csp_id: UID };
  (function attempt(){
    var st = ctSent[ev];
    if (st.done) return;
    try {
      if (window.CleverTap && typeof window.CleverTap.pushEvent === 'function') {
        window.CleverTap.pushEvent(ev, JSON.stringify(p)); st.done = true; return;
      }
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.clevertap) {
        window.webkit.messageHandlers.clevertap.postMessage(
          { action: 'recordEventWithProps', event: ev, properties: p });
        st.done = true; return;
      }
    } catch (e) {}
    st.n++;
    if (st.n < 6) setTimeout(attempt, 250 * st.n);
  })();
}

/* ── Closing the banner ───────────────────────────────────────────────
   There is no CleverTap in-app to dismiss here, and the host app's JS bridge
   is not documented, so this tries every shape an Android WebView bridge
   commonly takes before falling back to the browser's own exits. Open the
   page with &diag=1 on a handset to see exactly what this app injects - the
   overlay lists every bridge-shaped object on window - and once that is known
   this whole ladder collapses to the one real call.

   history.back() is fired unconditionally: the earlier history.length > 1
   guard meant that a banner opened as the WebView's FIRST page - which is the
   normal case - skipped it and the page simply stayed put. */
function closePage(){
  var i, j, k, b, m, mh;
  var NAMES = ['CleverTap','Android','AndroidBridge','AndroidInterface','AndroidApp',
               'WiomApp','Wiom','wiom','JSBridge','JsBridge','NativeBridge','AppBridge',
               'NativeInterface','JavascriptInterface','nativeApp','mobileApp','app','bridge'];
  var METHODS = ['dismissInAppNotification','closeInAppNotification','closeWebView',
                 'closeWebview','closeWindow','closePage','close','finishActivity',
                 'finish','dismiss','exit','goBack','back','onBackPressed'];
  for (i = 0; i < NAMES.length; i++) {
    try { b = window[NAMES[i]]; } catch (e) { b = null; }
    if (!b) continue;
    for (j = 0; j < METHODS.length; j++) {
      try {
        if (typeof b[METHODS[j]] === 'function') { b[METHODS[j]](); return; }
      } catch (e) {}
    }
  }
  try {
    mh = window.webkit && window.webkit.messageHandlers;
    if (mh) {
      var HS = ['close','closeWebView','nativeClose','dismiss','clevertap','jsBridge','bridge'];
      for (k = 0; k < HS.length; k++) {
        if (mh[HS[k]] && typeof mh[HS[k]].postMessage === 'function') {
          mh[HS[k]].postMessage({ action: 'close' }); return;
        }
      }
    }
  } catch (e) {}
  try { window.open('', '_self'); } catch (e) {}
  try { window.close(); } catch (e) {}
  try { history.back(); } catch (e) {}
}

/* ── Bridge discovery ─────────────────────────────────────────────────
   &diag=1 only. Lists every object on window that looks like an injected
   native bridge (an object carrying functions) plus its method names, so the
   real close call can be identified from a screenshot instead of guessed at.
   Costs nothing when the parameter is absent. */
function diagOverlay(){
  var out = [], k, v, fns, i, seen = {};
  var SKIP = {window:1, self:1, top:1, parent:1, frames:1, document:1, location:1,
              navigator:1, history:1, screen:1, localStorage:1, sessionStorage:1,
              performance:1, console:1, crypto:1, caches:1, indexedDB:1, webkit:1};
  for (k in window) {
    if (SKIP[k] || seen[k]) continue;
    seen[k] = 1;
    try { v = window[k]; } catch (e) { continue; }
    if (!v || (typeof v !== 'object' && typeof v !== 'function')) continue;
    fns = [];
    try {
      for (i in v) { if (typeof v[i] === 'function') fns.push(i); if (fns.length > 11) break; }
    } catch (e) { continue; }
    if (fns.length) out.push(k + ' → ' + fns.join(', '));
    if (out.length > 26) break;
  }
  var wk = [];
  try {
    var mh = window.webkit && window.webkit.messageHandlers;
    if (mh) for (k in mh) wk.push(k);
  } catch (e) {}

  var box = document.createElement('div');
  box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;top:0;z-index:99999;overflow:auto;'
    + 'background:#161021;color:#7CFFB2;font:10px/1.5 monospace;padding:10px;'
    + 'white-space:pre-wrap;word-break:break-all;-webkit-user-select:text;user-select:text';
  box.textContent =
      'BRIDGE DIAG — screenshot this\n'
    + 'viewport ' + window.innerWidth + '×' + window.innerHeight
    + '  dpr ' + (window.devicePixelRatio || '?') + '\n'
    + 'cspId=' + UID + '  app=' + APP + '\n'
    + 'webkit.messageHandlers: ' + (wk.length ? wk.join(', ') : 'none') + '\n'
    + '---- objects on window carrying functions ----\n'
    + (out.length ? out.join('\n') : 'none found');
  box.addEventListener('click', function(){ box.parentNode.removeChild(box); }, false);
  document.body.appendChild(box);
}
if (Q.diag) { try { diagOverlay(); } catch (e) {} }


/* motion.micro - the dialog's own 200ms exit, kept. */
function fadeOut(then){
  try { document.getElementById('app').className = 'app'; } catch (e) {}
  setTimeout(then, 200);
}

var okDone = false;
function onOK(){
  if (okDone) return;
  okDone = true;
  document.getElementById('ok').className = 'cta gone';
  log('ok');
  ct('OK_Clicked');
  /* Closing tears down the WebView, so let the beacon leave first. The 200ms
     fade is the dialog's own motion.micro exit, kept. */
  fadeOut(closePage);
  /* If the page is still here a moment later, nothing closed it - say so
     rather than leaving a tap that looks dead. Self-removing: see .hint. */
  setTimeout(function(){
    try { document.getElementById('hint').className = 'hint show'; } catch (e) {}
  }, 1200);
}

var ok = document.getElementById('ok');
ok.addEventListener('click', onOK, false);
ok.addEventListener('keydown', function(e){
  if (e.keyCode === 13 || e.keyCode === 32) { e.preventDefault(); onOK(); }
}, false);

log('view');
ct('Shown');

/* ── Viewport height, measured ──
   A photo from a real handset (17 Sep) showed the page not filling the app's
   WebView: content stranded in the top third with the CTA in empty space. Some
   in-app WebViews mis-report viewport units, so the height is also set from
   window.innerHeight and re-set on resize/rotate. The CSS declares 100vh, then
   100dvh, then calc(var(--vh)*100) - last valid wins, so this takes over
   wherever it is available and changes nothing where vh already worked. */
function setVH(){
  try {
    var h = window.innerHeight || document.documentElement.clientHeight;
    if (h) document.documentElement.style.setProperty('--vh', (h / 100) + 'px');
  } catch (e) {}
}
setVH();
window.addEventListener('resize', setVH, false);
window.addEventListener('orientationchange', function(){ setTimeout(setVH, 120); }, false);

/* Paint, then fade in - a page that is already visible cannot animate in. */
setTimeout(function(){ document.getElementById('app').className = 'app in'; }, 16);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>बोनस स्थिति — campaign tracking</title>
<!--
Reads bonus_status_data.json, written by fetch_bonus_status.py.

There is NO sample data in this file, on purpose. An earlier dashboard in this
repo shipped placeholder numbers in the HTML and they were mistaken for real
ones. If the JSON is missing or empty, this page says so instead of drawing
something plausible.

Counts are unique CSPs unless a cell is labelled "events".
-->
<style>
:root{
  --ground:#FAFAFB; --surface:#FFFFFF; --sunk:#F4F2F7;
  --ink:#16121C; --muted:#5D5668; --faint:#948CA3;
  --line:#E7E4EC; --line-soft:#F1EFF4;
  --s1:#D9008D; --s1-soft:#FCE9F5;
  --s2:#1A6FD4; --s2-soft:#E8F0FC;
  --good:#0A7C46; --good-soft:#E4F5EC;
  --warn:#B45309; --warn-soft:#FBEEE0;
  --track:#ECE9F1;
  --shadow:0 1px 2px rgba(22,18,28,.04),0 6px 20px rgba(22,18,28,.05);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --dev:"Noto Sans Devanagari","Kohinoor Devanagari","Mukta",var(--sans);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#141119; --surface:#1D1926; --sunk:#232030;
    --ink:#F1EEF6; --muted:#ADA5BB; --faint:#7B7389;
    --line:#2E2839; --line-soft:#262130;
    --s1:#F53DA6; --s1-soft:#3B0F2A;
    --s2:#3D93F5; --s2-soft:#0F2544;
    --good:#4ECB8C; --good-soft:#10331F;
    --warn:#E9A44C; --warn-soft:#382713;
    --track:#2A2436;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#141119; --surface:#1D1926; --sunk:#232030;
  --ink:#F1EEF6; --muted:#ADA5BB; --faint:#7B7389;
  --line:#2E2839; --line-soft:#262130;
  --s1:#F53DA6; --s1-soft:#3B0F2A;
  --s2:#3D93F5; --s2-soft:#0F2544;
  --good:#4ECB8C; --good-soft:#10331F;
  --warn:#E9A44C; --warn-soft:#382713;
  --track:#2A2436;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.dev{font-family:var(--dev)}
.wrap{max-width:1080px;margin:0 auto;padding:44px 22px 88px;display:flex;
  flex-direction:column;gap:40px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--s1)}
h1{font-size:clamp(26px,4vw,34px);line-height:1.14;letter-spacing:-.02em;margin:8px 0 0;font-weight:700}
.lede{margin:12px 0 0;max-width:62ch;color:var(--muted)}
.stamp{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--mono);font-size:12px;padding:5px 10px;border-radius:6px;
  background:var(--sunk);border:1px solid var(--line);color:var(--muted)}
.chip b{color:var(--ink)}
h2{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);margin:0 0 16px}

/* ---- hero tiles ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:16px 18px;box-shadow:var(--shadow)}
.tile .k{font-size:12px;font-weight:600;color:var(--muted)}
.tile .v{font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-top:6px;
  font-variant-numeric:tabular-nums}
.tile .d{font-size:12px;color:var(--faint);margin-top:5px;font-weight:500}
.tile.act{border-color:var(--warn)}
.tile.act .v{color:var(--warn)}

/* ---- segment panels ---- */
.segs{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.segs{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:20px;box-shadow:var(--shadow)}
.phead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding-bottom:14px;border-bottom:1px solid var(--line-soft);margin-bottom:16px}
.pname{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:650}
.swatch{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.pn{font-size:12px;color:var(--faint);font-weight:600;font-variant-numeric:tabular-nums}

/* ---- funnel bars ---- */
.bars{display:flex;flex-direction:column;gap:11px}
.bar .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font-size:13px;margin-bottom:5px}
.bar .lbl{color:var(--muted)}
.bar .num{font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap}
.bar .num i{font-style:normal;color:var(--faint);font-weight:600;font-size:12px;margin-left:5px}
.track{height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.fill{height:100%;border-radius:5px;min-width:3px;transition:width .5s cubic-bezier(.3,1,.5,1)}
.bar:hover .fill{filter:saturate(1.15)}

/* ---- help mix ---- */
.mix{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.mixrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:13px}
.mixbar{height:8px;border-radius:4px;background:var(--track);overflow:hidden;margin-top:4px}
.mixbar span{display:block;height:100%;border-radius:4px}

/* ---- tables ---- */
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);
  font-weight:700;padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
td{padding:10px 16px;border-bottom:1px solid var(--line-soft);color:var(--muted)}
td:first-child{color:var(--ink);font-weight:500}
tr:last-child td{border-bottom:none}
code{font-family:var(--mono);font-size:.86em;background:var(--sunk);border:1px solid var(--line-soft);
  border-radius:5px;padding:1px 5px;color:var(--ink)}

/* ---- callback queue ---- */
.queue{background:var(--surface);border:1px solid var(--warn);border-radius:12px;
  padding:18px 20px;box-shadow:var(--shadow)}
.queue h3{margin:0;font-size:16px;font-weight:650;color:var(--warn)}
.ids{font-family:var(--mono);font-size:12px;line-height:1.9;color:var(--ink);
  margin-top:12px;word-spacing:5px;max-height:180px;overflow-y:auto}
.pill{display:inline-block;font-family:var(--mono);font-size:11.5px;background:var(--sunk);
  border:1px solid var(--line);border-radius:5px;padding:2px 7px;margin:0 5px 5px 0;color:var(--muted)}
.pill b{color:var(--ink)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;
  padding:34px 22px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.note{background:var(--sunk);border:1px solid var(--line);border-left:3px solid var(--s1);
  border-radius:10px;padding:13px 16px;font-size:13.5px;color:var(--muted);line-height:1.7}
.note b{color:var(--ink)}
footer{border-top:1px solid var(--line);padding-top:20px;color:var(--faint);font-size:12.5px}

#tip{position:fixed;z-index:60;pointer-events:none;opacity:0;transition:opacity .12s;
  background:var(--ink);color:var(--ground);font-size:12px;font-weight:600;
  border-radius:7px;padding:6px 10px;white-space:nowrap;transform:translate(-50%,-130%)}
#tip.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">CleverTap in-app · CSP partner app</div>
    <h1>बोनस स्थिति — who saw it, who acted, who wants a call</h1>
    <p class="lede">Two creatives, one per segment, telling partners who are one or two checks
    short of qualifying exactly where they stand for the August bonus. Every number below is
    <b>unique CSPs</b> unless the column says events.</p>
    <div class="stamp" id="stamp"></div>
  </header>

  <section id="hero"></section>
  <section id="segments"></section>
  <section id="queue"></section>
  <section id="clicks"></section>
  <section id="plumbing"></section>

  <footer id="foot"></footer>
</div>
<div id="tip"></div>

<script>
/* Block comments only — this file is not a CleverTap creative, but it shares a
   repo with ones that are, and the habit costs nothing. */
(function(){
  var COLORS = {S3_char_me_se_3: "--s1", S4_char_me_se_2: "--s2"};
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s).replace(/[&<>"]/g,
    function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); };
  var pct = function(n, d){ return d ? Math.round(n / d * 100) : 0; };
  var cvar = function(k){ return getComputedStyle(document.documentElement)
    .getPropertyValue(k).trim(); };

  /* hover layer — every bar reports its own numbers */
  var tip = $("tip");
  function bindTip(el, text){
    el.addEventListener("mouseenter", function(e){
      tip.textContent = text; tip.classList.add("on");
      tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px";
    });
    el.addEventListener("mousemove", function(e){
      tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px";
    });
    el.addEventListener("mouseleave", function(){ tip.classList.remove("on"); });
  }

  function bar(label, users, denom, colorVar, rawNote){
    var w = denom ? Math.max(0.8, users / denom * 100) : 0;
    var d = document.createElement("div");
    d.className = "bar";
    d.innerHTML = '<div class="top"><span class="lbl">' + esc(label) + '</span>' +
      '<span class="num">' + users + '<i>' + pct(users, denom) + '%</i></span></div>' +
      '<div class="track"><span class="fill" style="width:' + w +
      '%;background:var(' + colorVar + ')"></span></div>';
    bindTip(d, label + " — " + users + " CSPs, " + pct(users, denom) + "% of those shown" +
                (rawNote ? " · " + rawNote + " events" : ""));
    return d;
  }

  function render(d){
    var segs = d.segments || [], t = d.totals || {};

    $("stamp").innerHTML =
      '<span class="chip">refreshed <b>' + esc(d.generated || "—") + '</b></span>' +
      '<span class="chip">live since <b>12 Aug 2026</b></span>' +
      '<span class="chip">cycle ends <b>31 Aug</b></span>' +
      '<span class="chip">credits <b>1 Sep</b></span>';

    /* ---- hero: the four numbers worth acting on ---- */
    function tile(k, v, sub, cls){
      return '<div class="tile' + (cls ? " " + cls : "") + '"><div class="k">' + k +
             '</div><div class="v">' + v + '</div><div class="d">' + sub + '</div></div>';
    }
    $("hero").innerHTML = '<h2>Where the campaign stands</h2><div class="tiles">' +
      tile("Partners reached", t.reached + '<span style="font-size:17px;color:var(--faint)"> / ' +
           t.audience + "</span>", pct(t.reached, t.audience) + "% of the audience saw the screen") +
      tile("Tapped through to सेवा स्थिति", t.goto,
           pct(t.goto, t.reached) + "% of those reached — the intent metric") +
      tile("Asked to be called back", t.callbacks,
           "a queue someone has to work", "act") +
      tile("Said they want to talk", t.need_help,
           "answered हाँ, बात करनी है on page 2") +
      "</div>";

    /* ---- per-segment funnel + help mix ---- */
    var wrapEl = document.createElement("div");
    wrapEl.className = "segs";
    segs.forEach(function(s){
      var cv = COLORS[s.key] || "--s1";
      var p = document.createElement("div");
      p.className = "panel";
      p.innerHTML =
        '<div class="phead"><div class="pname"><span class="swatch" style="background:var(' +
        cv + ')"></span><span class="dev">' + esc(s.label) + '</span></div>' +
        '<span class="pn">' + s.reached + " / " + s.size + " reached</span></div>";

      var bars = document.createElement("div");
      bars.className = "bars";
      var top = (s.funnel[0] || {}).users || 0;
      s.funnel.forEach(function(f){
        bars.appendChild(bar(f.label, f.users, top || s.size, cv,
                             f.raw !== f.users ? f.raw : null));
      });
      p.appendChild(bars);

      var h = document.createElement("div");
      var answered = s.help_answered || 0;
      h.innerHTML = '<h2 style="margin:22px 0 10px">Help question · ' + answered +
                    " answered</h2>";
      var mix = document.createElement("div");
      mix.className = "mix";
      var hmax = Math.max.apply(null, s.help.map(function(x){ return x.users; }).concat([1]));
      s.help.forEach(function(x){
        var row = document.createElement("div");
        var col = x.key === "need_help" ? "--warn" : cv;
        row.innerHTML = '<div><div class="mixrow"><span class="dev">' + esc(x.label) +
          '</span><span class="num" style="font-variant-numeric:tabular-nums;font-weight:650">' +
          x.users + '</span></div><div class="mixbar"><span style="width:' +
          (x.users / hmax * 100) + "%;background:var(" + col + ')"></span></div></div>';
        bindTip(row, x.label + " — " + x.users + " CSPs");
        mix.appendChild(row);
      });
      h.appendChild(mix);
      p.appendChild(h);
      wrapEl.appendChild(p);
    });
    $("segments").innerHTML = "<h2>By segment</h2>";
    $("segments").appendChild(wrapEl);

    /* ---- the callback queue ---- */
    var ids = d.all_callback_ids || [];
    $("queue").innerHTML = "<h2>Callback queue</h2>" +
      '<div class="queue"><h3>' + ids.length +
      " partner" + (ids.length === 1 ? "" : "s") + " asked for a call</h3>" +
      '<p style="margin:6px 0 0;font-size:13.5px;color:var(--muted)">The screen promises a call ' +
      'in <span class="dev">1–2 दिन</span>. CSP IDs only — join to the segment CSV for a number.</p>' +
      (ids.length ? '<div class="ids">' + ids.map(esc).join(" ") + "</div>"
                  : '<div class="ids" style="color:var(--faint)">none yet</div>') +
      "</div>";

    /* ---- every distinct tap ---- */
    var rows = "";
    (segs[0] ? segs[0].clicks : []).forEach(function(c, i){
      var cells = segs.map(function(s){
        var m = s.clicks[i] || {users: 0, raw: 0};
        return '<td class="n">' + m.users + '</td><td class="n" style="color:var(--faint)">' +
               m.raw + "</td>";
      }).join("");
      rows += '<tr><td class="dev">' + esc(c.label) + '</td><td><code>' +
              esc(c.event) + "</code></td>" + cells + "</tr>";
    });
    $("clicks").innerHTML = "<h2>Every tap, counted separately</h2>" +
      '<div class="tw"><table><thead><tr><th>Element</th><th>Event</th>' +
      segs.map(function(s){ return '<th class="n dev">' + esc(s.label) +
        '</th><th class="n">events</th>'; }).join("") +
      "</tr></thead><tbody>" + rows + "</tbody></table></div>";

    /* ---- plumbing: which deep-link route ran, where people quit ---- */
    var plumb = segs.map(function(s){
      var m = s.deeplink_mechanism || {}, pg = s.dismiss_by_page || {};
      var mk = Object.keys(m).map(function(k){
        return '<span class="pill"><b>' + esc(k) + "</b> " + m[k] + "</span>"; }).join("");
      var pk = Object.keys(pg).sort().map(function(k){
        return '<span class="pill">page <b>' + esc(k) + "</b> " + pg[k] + "</span>"; }).join("");
      return '<div class="panel"><div class="pname" style="font-size:15px;margin-bottom:10px">' +
        '<span class="swatch" style="background:var(' + (COLORS[s.key] || "--s1") + ')"></span>' +
        '<span class="dev">' + esc(s.label) + "</span></div>" +
        '<div style="font-size:12px;color:var(--faint);font-weight:700;letter-spacing:.06em;' +
        'text-transform:uppercase;margin-bottom:7px">Deep-link route used</div>' +
        (mk || '<span class="pill">no data</span>') +
        '<div style="font-size:12px;color:var(--faint);font-weight:700;letter-spacing:.06em;' +
        'text-transform:uppercase;margin:14px 0 7px">Closed on</div>' +
        (pk || '<span class="pill">no data</span>') + "</div>";
    }).join("");
    $("plumbing").innerHTML = "<h2>Plumbing</h2><div class=\"segs\">" + plumb + "</div>" +
      '<div class="note" style="margin-top:14px"><b>Deep-link route</b> is which hand-off the ' +
      'creative used — <code>location_href</code> is the branch that works on this SDK build. ' +
      'If <code>openDeepLink</code> ever starts appearing, the bridge gained the method and ' +
      'the chain can be simplified. <b>Closed on</b> is the page the ✕ was tapped from, so a ' +
      'spike on page 1 means the status itself is not landing.</div>';

    $("foot").innerHTML = "Source: <code>bonus_status_data.json</code>, written by " +
      "<code>fetch_bonus_status.py</code> from the CleverTap events export. Unique CSPs " +
      "deduplicated on <code>profileData.cspid</code>; the test shop is excluded. " +
      "No partner names or phone numbers appear on this page.";
  }

  fetch("bonus_status_data.json", {cache: "no-store"})
    .then(function(r){ if (!r.ok) throw new Error("no data file"); return r.json(); })
    .then(function(d){
      if (!d.segments || !d.segments.length) throw new Error("empty");
      render(d);
    })
    .catch(function(){
      $("hero").innerHTML = '<div class="empty"><b>No data yet</b>' +
        "This page draws only from <code>bonus_status_data.json</code>. Run " +
        "<code>python3 fetch_bonus_status.py</code> — or the <code>bonus-status</code> " +
        "GitHub Action — once the campaigns have been live for a few hours.</div>";
    });
})();
</script>
</body>
</html>
